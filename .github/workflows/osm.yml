name: Actualizar puntos desde OpenStreetMap
on:
  schedule:
    - cron: "17 6 * * 1"   # cada lunes
  workflow_dispatch:        # también se puede ejecutar a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/osm_puntos.py
      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm_biobio.json
          git diff --cached --quiet || (git commit -m "Actualiza puntos desde OpenStreetMap" && git push)
